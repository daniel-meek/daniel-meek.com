<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playback Speed Calculator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }
        .time-inputs {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .time-inputs input {
            flex: 1;
            text-align: center;
        }
        .time-inputs span {
            font-weight: bold;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 5px;
            text-align: center;
            font-size: 16px;
            color: #333;
            min-height: 24px;
        }
        .error {
            color: #dc3545;
        }
    </style>
</head>
<body>

<div class="calculator-container">
    <h2>Playback Calculator</h2>
    
    <div class="input-group">
        <label>Original Time (HH : MM : SS)</label>
        <div class="time-inputs">
            <input type="number" id="hoursInput" min="0" placeholder="HH" />
            <span>:</span>
            <input type="number" id="minutesInput" min="0" max="59" placeholder="MM" />
            <span>:</span>
            <input type="number" id="secondsInput" min="0" max="59" placeholder="SS" />
        </div>
    </div>
    
    <div class="input-group">
        <label for="speedInput">Playback Speed</label>
        <input type="number" id="speedInput" step="0.1" min="0.1" placeholder="e.g., 1.5" />
    </div>
    
    <button onclick="calculatePlayback()">Calculate</button>
    
    <div id="result" class="result">
        Enter time and speed to see results.
    </div>
</div>

<script>
    function formatTime(totalSeconds) {
        totalSeconds = Math.round(totalSeconds);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        
        // Helper function to add leading zeros
        const pad = (num) => num.toString().padStart(2, '0');

        if (hours > 0) {
            return `${hours}:${pad(minutes)}:${pad(seconds)}`;
        } else {
            return `${minutes}:${pad(seconds)}`;
        }
    }

    function calculatePlayback() {
        // Parse inputs, defaulting to 0 if left blank
        const hours = parseInt(document.getElementById('hoursInput').value) || 0;
        const minutes = parseInt(document.getElementById('minutesInput').value) || 0;
        const seconds = parseInt(document.getElementById('secondsInput').value) || 0;
        
        const speedInput = parseFloat(document.getElementById('speedInput').value);
        const resultDiv = document.getElementById('result');

        try {
            // Validate inputs
            if (hours === 0 && minutes === 0 && seconds === 0) {
                throw new Error("Please enter a valid time greater than zero.");
            }
            if (isNaN(speedInput) || speedInput <= 0) {
                throw new Error("Speed must be a number greater than 0.");
            }

            // Calculate total seconds from the three fields
            const originalSeconds = (hours * 3600) + (minutes * 60) + seconds;
            
            // Perform speed calculations
            const newSeconds = originalSeconds / speedInput;
            const savedSeconds = originalSeconds - newSeconds;

            // Format back to strings
            const newTimeStr = formatTime(newSeconds);
            const savedTimeStr = formatTime(savedSeconds);

            // Display results
            resultDiv.classList.remove('error');
            resultDiv.innerHTML = `<strong>new time:</strong> ${newTimeStr} <br> <strong>time saved:</strong> ${savedTimeStr}`;
            
        } catch (error) {
            // Display errors
            resultDiv.classList.add('error');
            resultDiv.innerHTML = error.message;
        }
    }
</script>

</body>
</html>
